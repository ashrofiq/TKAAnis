<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Tryout TKA Anis</title>
<style>

@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--tx:#e8edf7;--mu:#9aa8c2;--pr:#6a9bff;--prt:#0f1624;--ok:#4ade80;--bad:#f87171;--bd:#2a3757}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{margin:0 0 6px;font-size:1.6rem}.mu{color:var(--mu);font-size:.9rem}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px}
.b{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}.b,.g{flex:1}
button:disabled{opacity:.4}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:8px 0;background:var(--bg)}
.op{display:block;width:100%;text-align:left;margin-top:8px}.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 16%,var(--card));font-weight:600}
.q{font-size:1.05rem;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tm{font-weight:700;color:var(--pr)}
.tx{background:color-mix(in srgb,var(--pr) 7%,var(--card));font-size:.97rem}
.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:12px}.n{padding:6px 0;font-size:.78rem}.dn{background:color-mix(in srgb,var(--pr) 25%,var(--card))}.cur{outline:2px solid var(--pr)}
.row{display:flex;gap:8px}.sc{font-size:3rem;font-weight:800;color:var(--pr);margin:0}
.pk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.pk button{padding:8px 0}.pk small{display:block;font-size:.7rem;color:var(--ok)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.rv{border-left:4px solid var(--bd);padding-left:10px;margin:12px 0;font-size:.95rem}

body{background:linear-gradient(180deg,color-mix(in srgb,var(--pr) 16%,var(--bg)) 0,var(--bg) 280px) no-repeat,var(--bg)}

.vc{flex:1;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg)}.vc.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}.vc .ic{font-size:1.7rem}
.pk button{border-radius:12px;font-weight:600}.pk .sel{background:var(--pr);color:var(--prt);border-color:var(--pr)}.pk .sel small{color:var(--prt)}
.op{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 12px;transition:.15s}

.op.sel i{background:var(--pr);color:var(--prt);border-color:var(--pr)}

.tm{background:var(--card);border:1px solid var(--bd);padding:4px 12px;border-radius:99px}.tm.low{color:var(--bad);border-color:var(--bad)}

.srow{display:flex;justify-content:space-between;padding:3px 0}
.chips{display:flex;gap:6px;margin:8px 0 12px}.chips button{flex:1;border-radius:99px;padding:6px;font-size:.9rem}.chips .sel{background:var(--pr);color:var(--prt);border-color:var(--pr)}

</style></head><body><div id="app"></div>
<script>
// ===== Pengacak dengan seed: tiap nomor paket selalu menghasilkan soal yang sama =====
let rng;const seed=s=>{let a=s;rng=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const R=(a,b)=>Math.floor(rng()*(b-a+1))+a,sh=a=>a.map(x=>[rng(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]),P=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a,F=x=>typeof x=='number'?String(x).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):x;
const D=n=>String(Math.round(n*100)/100).replace('.',','),fr=(n,d)=>{const g=gcd(n,d);return`${n/g}/${d/g}`},T=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}.${String(m%60).padStart(2,'0')}`;
function mk(q,c,d,e){const num=typeof c=='number';let w=[...new Set(d)].filter(x=>x!==c&&(!num||x>=0));for(let k=1;num&&w.length<3;k++){const v=c+k*R(1,6);if(!w.includes(v))w.push(v)}for(const z of['Tidak ada jawaban yang benar','Tidak dapat ditentukan','Semua benar'])if(!num&&w.length<3)w.push(z);return{q,k:1,a:[F(c)],o:sh([c,...w.slice(0,3)].map(F)),e}}
const mkK=(q,cs,ws,e)=>({q,k:2,a:cs,o:sh([...cs,...ws]),e});
let VZ='';
const svg=(w,h,b)=>`<div class="vz"><svg viewBox="0 0 ${w} ${h}" style="max-width:${w}px;width:100%;display:block;margin:0 auto" font-family="system-ui,sans-serif" font-size="13" fill="currentColor">${b}</svg></div>`,FL='fill="color-mix(in srgb,var(--pr) 20%,transparent)" stroke="var(--pr)" stroke-width="2"';
const rect=(p,l,u)=>{const W=170,H=Math.max(40,Math.min(100,170*l/p));return svg(250,H+50,`<rect x="50" y="10" width="${W}" height="${H}" ${FL}/><text x="${50+W/2}" y="${H+32}" text-anchor="middle">${p} ${u}</text><text x="44" y="${14+H/2}" text-anchor="end">${l} ${u}</text>`)};
const tri=(a,t)=>svg(240,135,`<polygon points="30,110 200,110 150,15" ${FL}/><line x1="150" y1="15" x2="150" y2="110" stroke="var(--bad)" stroke-dasharray="4"/><text x="115" y="128" text-anchor="middle">alas ${a} cm</text><text x="156" y="68">t = ${t} cm</text>`);
const box=(p,l,t)=>svg(250,155,`<rect x="40" y="50" width="130" height="80" ${FL}/><polygon points="40,50 70,25 200,25 170,50" ${FL}/><polygon points="170,50 200,25 200,105 170,130" ${FL}/><text x="105" y="148" text-anchor="middle">p = ${p} cm</text><text x="34" y="94" text-anchor="end">t = ${t} cm</text><text x="206" y="70">l = ${l} cm</text>`);
const circ=r=>svg(220,130,`<circle cx="110" cy="65" r="55" ${FL}/><line x1="110" y1="65" x2="165" y2="65" stroke="var(--bad)" stroke-width="2"/><circle cx="110" cy="65" r="3"/><text x="138" y="58" text-anchor="middle">r = ${r} cm</text>`);
const taman=(p,l,s)=>svg(250,150,`<rect x="25" y="10" width="200" height="105" ${FL}/><rect x="105" y="42" width="40" height="40" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/><text x="125" y="66" text-anchor="middle" font-size="11">${s} m</text><text x="125" y="135" text-anchor="middle">${p} m × ${l} m</text>`);
const bars=(lab,val)=>{const m=Math.max(...val);return svg(250,150,lab.map((x,i)=>{const h=val[i]/m*85,x0=20+i*56;return`<rect x="${x0}" y="${110-h}" width="40" height="${h}" rx="4" fill="var(--pr)"/><text x="${x0+20}" y="${104-h}" text-anchor="middle" font-size="12">${val[i]}</text><text x="${x0+20}" y="128" text-anchor="middle" font-size="10">${x.length>8?x.slice(0,7)+'.':x}</text>`}).join(''))};
const clock=m=>{const hh=(Math.floor(m/60)%12)+(m%60)/60,a=hh*Math.PI/6,b=(m%60)*Math.PI/30,X=(l,t)=>60+l*Math.sin(t),Y=(l,t)=>60-l*Math.cos(t);return svg(120,120,`<circle cx="60" cy="60" r="52" ${FL}/><text x="60" y="22" text-anchor="middle" font-size="11">12</text><text x="104" y="64" text-anchor="middle" font-size="11">3</text><text x="60" y="108" text-anchor="middle" font-size="11">6</text><text x="16" y="64" text-anchor="middle" font-size="11">9</text><line x1="60" y1="60" x2="${X(28,a)}" y2="${Y(28,a)}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="60" x2="${X(40,b)}" y2="${Y(40,b)}" stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round"/>`)};
const kel=(r,b,h)=>{const c=[...Array(r).fill('#ef4444'),...Array(b).fill('#3b82f6'),...Array(h).fill('#22c55e')];return svg(250,70,c.map((x,i)=>`<circle cx="${16+(i%12)*19}" cy="${16+Math.floor(i/12)*22}" r="8" fill="${x}"/>`).join(''))};
const fracbar=(n,d)=>svg(240,42,Array.from({length:d},(_,i)=>`<rect x="${10+i*220/d}" y="8" width="${220/d}" height="26" fill="${i<n?'var(--pr)':'transparent'}" stroke="var(--pr)" stroke-width="2"/>`).join(''));
const EM=['🧹🌳','🦇🌙','📢📚','🎒🌧️','💧🥛','📊','🐜🍃🕊️','🌱💦'];
const NM=['Ani','Budi','Citra','Dedi','Eka','Fajar','Gina','Hadi','Indah','Joko'];
// ===== Pembantu pembahasan: Teori -> Langkah -> Jawaban =====
const EX=(t,s,k)=>`📘 <b>Teori:</b> ${t}<br><b>Langkah penyelesaian:</b><br>${s.map((x,i)=>`${i+1}. ${x}`).join('<br>')}<br>✅ <b>Jawaban:</b> ${k}`;
const kl=(x,m)=>Array.from({length:Math.floor(m/x)},(_,i)=>x*(i+1)).join(', ');
const fk=n=>Array.from({length:n},(_,i)=>i+1).filter(x=>n%x==0).join(', ');
const fp=(x,y)=>Array.from({length:Math.min(x,y)},(_,i)=>i+1).filter(i=>x%i==0&&y%i==0).join(', ');
const SM={'persegi':4,'persegi panjang':2,'belah ketupat':2,'segitiga sama sisi':3,'layang-layang':1,'segitiga sama kaki':1};
const ck=(p,b,r)=>`“${p}” → ${b?'✔ benar':'✘ salah'}, ${r}`;
const TS='Informasi tersurat adalah informasi yang ditulis langsung di dalam teks. Cara menjawabnya: temukan kata kunci pertanyaan, cari kata itu di teks, lalu baca kalimat di sekitarnya.';
const IP='Ide pokok adalah gagasan utama yang dibahas di seluruh teks. Jawaban yang tepat mencakup semua kalimat; pilihan yang hanya membahas satu detail disebut ide penjelas, bukan ide pokok.';
const SIM='Simpulan adalah ringkasan isi teks yang ditarik dari fakta-fakta dalam teks, tanpa menambah informasi baru dan tanpa bertentangan dengan teks.';
const SIKAP='Sifat atau sikap tokoh tidak selalu ditulis langsung, tetapi disimpulkan dari perbuatan dan perkataannya (penokohan tidak langsung).';
const KOMP='Pilihan ganda kompleks: periksa setiap pernyataan satu per satu terhadap teks. Pernyataan benar hanya jika didukung teks, dan jawaban yang benar bisa lebih dari satu.';
// ===== 30 jenis soal Matematika dan Numerasi: Bilangan (0-13), Geometri dan Pengukuran (14-23), Data dan Peluang (24-29) =====
const G=[
()=>{const a=R(1200,4800),b=R(1200,4800),c=a+b;return mk(`Toko ${P(NM)} menjual ${F(a)} pensil pada bulan Januari dan ${F(b)} pensil pada bulan Februari. Banyak pensil yang terjual selama dua bulan adalah ...`,c,[c+100,c-100,c+1000],EX('Penjumlahan dipakai untuk menggabungkan dua jumlah sejenis (pensil dengan pensil) menjadi satu jumlah total.',[`Diketahui: Januari = ${F(a)} pensil dan Februari = ${F(b)} pensil.`,`Yang ditanya total dua bulan, maka rumusnya: total = Januari + Februari.`,`Hitung: ${F(a)} + ${F(b)} = ${F(c)}.`,`Cek dengan operasi lawan: ${F(c)} − ${F(b)} = ${F(a)} (sama dengan data Januari, jadi benar).`],`${F(c)} pensil.`))},
()=>{const a=R(5000,9000),b=R(1000,4000),c=a-b;return mk(`Sebuah gudang berisi ${F(a)} kg beras. Sebanyak ${F(b)} kg dikirim ke pasar. Sisa beras di gudang adalah ... kg.`,c,[c+100,c-1000,a+b],EX('Pengurangan dipakai ketika sebagian jumlah awal keluar atau berkurang: sisa = jumlah awal − jumlah yang keluar.',[`Diketahui: persediaan awal = ${F(a)} kg, dikirim = ${F(b)} kg.`,`Rumus: sisa = ${F(a)} − ${F(b)}.`,`Hitung: ${F(a)} − ${F(b)} = ${F(c)}.`,`Cek: ${F(c)} + ${F(b)} = ${F(a)} (kembali ke persediaan awal, jadi benar).`],`${F(c)} kg.`))},
()=>{const n=R(12,40),m=R(12,36),c=n*m;return mk(`Sebuah toko roti membuat ${n} kotak roti. Setiap kotak berisi ${m} roti. Banyak roti seluruhnya adalah ...`,c,[n+m,c+m,c-n],EX(`Perkalian adalah penjumlahan berulang: ${n} kotak berisi ${m} roti sama dengan ${m} dijumlahkan sebanyak ${n} kali.`,[`Diketahui: ${n} kotak, tiap kotak berisi ${m} roti.`,`Rumus: banyak roti = banyak kotak × isi tiap kotak = ${n} × ${m}.`,`Pecah ${m} agar mudah (sifat distributif): ${n} × ${m} = (${n} × ${Math.floor(m/10)*10}) + (${n} × ${m%10}).`,`Hitung: ${n*Math.floor(m/10)*10} + ${n*(m%10)} = ${c}.`],`${c} roti.`))},
()=>{const b=R(4,9),q=R(12,30),r=R(1,b-1),a=b*q+r;return mk(`${a} permen dibagikan sama banyak kepada ${b} anak. Setiap anak mendapat ... permen.`,q,[q+1,q-1,r],EX('Pembagian dipakai untuk membagi sama banyak. Hasil bagi adalah bagian tiap penerima, dan sisa (selalu lebih kecil dari pembagi) tidak dapat dibagi rata lagi.',[`Diketahui: ${a} permen dibagikan kepada ${b} anak. Ditanya: bagian tiap anak.`,`Tulis pembagian: ${a} : ${b}.`,`Cari kelipatan ${b} terbesar yang tidak melebihi ${a}: ${b} × ${q} = ${b*q}.`,`Sisa = ${a} − ${b*q} = ${r}. Karena ${r} < ${b}, sisa itu tidak cukup dibagikan lagi.`],`${q} permen untuk setiap anak (sisa ${r} permen).`))},
()=>{const d=P([4,5,8]),n=R(1,d-1),w=d*R(3,8),c=n*w/d;VZ=fracbar(n,d);return mk(`Dari ${w} siswa kelas VI, ${n}/${d} bagian mengikuti pramuka. Banyak siswa yang mengikuti pramuka adalah ...`,c,[w/d,c+w/d,w-c],EX('Pecahan dari suatu bilangan: n/d dari w berarti (n/d) × w. Caranya: bagi w dengan penyebut untuk mendapat nilai 1 bagian, lalu kalikan dengan pembilang.',[`Diketahui: seluruh siswa = ${w}, bagian pramuka = ${n}/${d}.`,`Cari nilai 1/${d} bagian: ${w} : ${d} = ${w/d}.`,`Ambil ${n} bagian: ${n} × ${w/d} = ${c}.`,`Cek dengan rumus langsung: ${n}/${d} × ${w} = ${n*w}/${d} = ${c}.`],`${c} siswa.`))},
()=>{const d=R(3,7),n=R(1,d-1),m=R(2,5);VZ=fracbar(n,d);return mk(`Pecahan yang senilai dengan ${n}/${d} adalah ...`,`${n*m}/${d*m}`,[`${n+m}/${d+m}`,`${n*m}/${d+m}`,`${n}/${d*m}`],EX(`Pecahan senilai diperoleh dengan mengalikan (atau membagi) pembilang dan penyebut dengan bilangan yang sama bukan nol, sebab itu sama dengan mengalikan pecahan dengan 1 (misalnya ${m}/${m}).`,[`Pecahan awal: ${n}/${d}.`,`Pilih pengali ${m}: pembilang ${n} × ${m} = ${n*m}, penyebut ${d} × ${m} = ${d*m}.`,`Hasilnya ${n*m}/${d*m}.`,`Cek dengan membagi balik: ${n*m} : ${m} = ${n} dan ${d*m} : ${m} = ${d}, kembali ke ${n}/${d}.`,`Pilihan lain salah karena pembilang dan penyebutnya tidak dikali bilangan yang sama (ada yang ditambah atau hanya salah satu yang diubah), sehingga nilainya berubah.`],`${n*m}/${d*m}.`))},
()=>{const [d1,d2]=P([[2,4],[3,6],[2,3],[4,8],[5,10]]),L=d1*d2/gcd(d1,d2),s=L/d1+L/d2;return mk(`Hasil dari 1/${d1} + 1/${d2} adalah ...`,fr(s,L),[`2/${d1+d2}`,`2/${L}`,`${s+1}/${L}`,`2/${Math.max(d1,d2)}`],EX('Pecahan berpenyebut berbeda hanya bisa dijumlahkan setelah penyebutnya disamakan, memakai KPK dari kedua penyebut. Setelah itu, hanya pembilang yang dijumlahkan.',[`Penyebut: ${d1} dan ${d2}. KPK ${d1} dan ${d2} = ${L}.`,`Ubah 1/${d1}: ${L} : ${d1} = ${L/d1}, maka 1/${d1} = ${L/d1}/${L}.`,`Ubah 1/${d2}: ${L} : ${d2} = ${L/d2}, maka 1/${d2} = ${L/d2}/${L}.`,`Jumlahkan pembilang: ${L/d1}/${L} + ${L/d2}/${L} = ${s}/${L}.`,`Sederhanakan dengan FPB ${gcd(s,L)}: ${s}/${L} = ${fr(s,L)}.`],`${fr(s,L)}.`))},
()=>{const [a,b]=P([[4,6],[6,8],[6,9],[10,15],[8,12],[12,18]]),c=a*b/gcd(a,b);return mk(`Lampu merah menyala setiap ${a} detik dan lampu biru setiap ${b} detik. Jika keduanya menyala bersamaan, keduanya akan menyala bersamaan lagi setelah ... detik.`,c,[a*b,gcd(a,b),c+a],EX('KPK (Kelipatan Persekutuan Terkecil) dipakai untuk kejadian berulang yang ingin diketahui kapan terjadi bersamaan lagi.',[`Kelipatan ${a}: ${kl(a,c)}, ...`,`Kelipatan ${b}: ${kl(b,c)}, ...`,`Bilangan pertama yang muncul di kedua daftar adalah ${c}, jadi KPK ${a} dan ${b} = ${c}.`,`Cek: ${c} : ${a} = ${c/a} dan ${c} : ${b} = ${c/b} (keduanya habis dibagi).`],`${c} detik.`))},
()=>{const [a,b]=P([[12,18],[24,36],[18,27],[16,24],[30,45]]),c=gcd(a,b);return mk(`Ibu memiliki ${a} apel dan ${b} jeruk. Buah itu dimasukkan ke dalam kantong dengan isi apel dan jeruk sama banyak pada tiap kantong. Banyak kantong paling banyak yang dapat dibuat adalah ...`,c,[c*2,c+2,a*b/c],EX('FPB (Faktor Persekutuan Terbesar) dipakai untuk membagi dua kelompok benda ke dalam kelompok terbanyak dengan isi yang sama rata.',[`Faktor ${a}: ${fk(a)}.`,`Faktor ${b}: ${fk(b)}.`,`Faktor persekutuan: ${fp(a,b)}. Yang terbesar adalah ${c}, jadi FPB = ${c}.`,`Banyak kantong terbanyak = ${c}. Isi tiap kantong: ${a} : ${c} = ${a/c} apel dan ${b} : ${c} = ${b/c} jeruk (kedua jenis habis terbagi).`],`${c} kantong.`))},
()=>{const h=R(2,9)*10000,p=P([10,20,25,30]),c=h*(100-p)/100;return mk(`Sepatu seharga Rp${F(h)} mendapat diskon ${p}%. Harga sepatu setelah diskon adalah Rp ...`,c,[h*p/100,h+h*p/100,c+5000],EX('Persen berarti per seratus: p% = p/100. Besar diskon = p% × harga awal, dan harga akhir = harga awal − diskon.',[`Diketahui: harga awal Rp${F(h)}, diskon ${p}%.`,`Hitung diskon: ${p}/100 × ${F(h)} = Rp${F(h*p/100)}.`,`Harga akhir = ${F(h)} − ${F(h*p/100)} = Rp${F(c)}.`,`Cara cepat: bayar ${100-p}% dari harga awal, yaitu ${100-p}/100 × ${F(h)} = Rp${F(c)} (hasilnya sama).`],`Rp${F(c)}.`))},
()=>{const x=R(11,59),y=R(11,59),c=D((x+y)/10);return mk(`Tali merah panjangnya ${D(x/10)} m dan tali biru ${D(y/10)} m. Jika disambung, panjang kedua tali adalah ... m.`,c,[D((x+y)/100),D((x+y)/10+1),D(x+y)],EX('Pecahan desimal dijumlahkan dengan menyejajarkan koma agar angka puluhan, satuan, dan persepuluhan berada pada kolom yang sama. Satu angka di belakang koma berarti persepuluh (0,1).',[`Tali merah ${D(x/10)} m = ${x} × 0,1 m dan tali biru ${D(y/10)} m = ${y} × 0,1 m.`,`Disambung berarti dijumlahkan: ${D(x/10)} + ${D(y/10)}.`,`Jumlahkan persepuluhnya: ${x} + ${y} = ${x+y}, artinya ${x+y} × 0,1 = ${c}.`],`${c} m.`))},
()=>{const k=P([3,4,6,7]),ms=sh(Array.from({length:Math.floor(80/k)-1},(_,i)=>k*(i+2))).slice(0,2),ns=sh(Array.from({length:60},(_,i)=>i+15).filter(x=>x%k)).slice(0,2);return mkK(`Pilih dua bilangan yang merupakan kelipatan ${k}!`,ms.map(String),ns.map(String),EX(`Kelipatan ${k} adalah hasil perkalian ${k} dengan bilangan asli (${k}, ${2*k}, ${3*k}, ...). Suatu bilangan adalah kelipatan ${k} jika habis dibagi ${k} (sisa 0).`,[`Uji setiap bilangan dengan membaginya dengan ${k}.`,...ms.map(m=>`${m} : ${k} = ${m/k}, habis dibagi → kelipatan ${k} ✔`),...ns.map(x=>`${x} : ${k} = ${Math.floor(x/k)} sisa ${x%k} → bukan kelipatan ${k} ✘`)],`${ms.join(' dan ')}.`))},
()=>{const [a,b]=P([[2,3],[3,5],[1,4],[2,5],[3,4]]),u=R(2,12)*1000,c=a*u;return mk(`Uang Ani dan Budi berbanding ${a} : ${b}. Jika jumlah uang mereka Rp${F((a+b)*u)}, uang Ani adalah Rp ...`,c,[b*u,c+u,c-u],EX('Perbandingan a : b membagi jumlah menjadi (a + b) bagian yang sama besar. Nilai 1 bagian = jumlah : (a + b), dan bagian suatu pihak = banyak bagiannya × nilai 1 bagian.',[`Perbandingan Ani : Budi = ${a} : ${b}, jadi jumlah bagian = ${a} + ${b} = ${a+b}.`,`Nilai 1 bagian = Rp${F((a+b)*u)} : ${a+b} = Rp${F(u)}.`,`Uang Ani = ${a} bagian = ${a} × Rp${F(u)} = Rp${F(c)}.`,`Cek: uang Budi = ${b} × Rp${F(u)} = Rp${F(b*u)}, dan ${F(c)} + ${F(b*u)} = ${F((a+b)*u)} (sama dengan jumlah uang).`],`Rp${F(c)}.`))},
()=>{const s=P([100000,200000,500000]),p=R(2,9),c=p*s/100000;return mk(`Pada peta berskala 1 : ${F(s)}, jarak dua kota adalah ${p} cm. Jarak sebenarnya kedua kota adalah ... km.`,c,[p*s/100,p*s/10000,p*2],EX('Skala 1 : s artinya 1 cm pada peta mewakili s cm sebenarnya. Jarak sebenarnya = jarak peta × s. Untuk mengubah cm ke km: 1 km = 1.000 m = 100.000 cm.',[`Diketahui: skala 1 : ${F(s)}, jarak peta ${p} cm.`,`Jarak sebenarnya dalam cm = ${p} × ${F(s)} = ${F(p*s)} cm.`,`Ubah ke km: ${F(p*s)} : 100.000 = ${c} km.`],`${c} km.`))},
()=>{const p=R(10,30),l=R(5,p-1),c=2*(p+l);VZ=rect(p,l,'m');return mk(`Kebun berbentuk persegi panjang dengan panjang ${p} m dan lebar ${l} m. Kebun itu akan dipagari. Panjang pagar yang diperlukan adalah ... m.`,c,[p*l,p+l,2*p+l],EX('Keliling bangun datar adalah jumlah panjang semua sisinya. Persegi panjang punya dua sisi panjang dan dua sisi lebar, sehingga K = 2 × (p + l). Memagari berarti mengelilingi, jadi yang dihitung keliling (bukan luas).',[`Diketahui: panjang ${p} m, lebar ${l} m.`,`Jumlahkan panjang dan lebar: ${p} + ${l} = ${p+l}.`,`Kalikan 2: 2 × ${p+l} = ${c}.`,`Cek dengan menjumlahkan semua sisi: ${p} + ${l} + ${p} + ${l} = ${c}.`],`${c} m.`))},
()=>{const p=R(6,15),l=R(4,p-1),c=p*l;VZ=rect(p,l,'m');return mk(`Lantai kamar berbentuk persegi panjang berukuran ${p} m × ${l} m. Luas lantai kamar adalah ... m².`,c,[2*(p+l),p+l,c+p],EX('Luas persegi panjang adalah banyaknya persegi satuan yang menutupi permukaannya: L = panjang × lebar, satuannya kuadrat (m²).',[`Diketahui: panjang ${p} m, lebar ${l} m.`,`Rumus: L = p × l.`,`Hitung: ${p} × ${l} = ${c}.`,`Satuan: m × m = m².`],`${c} m².`))},
()=>{const a=2*R(3,10),t=R(4,15),c=a*t/2;VZ=tri(a,t);return mk(`Sebuah segitiga memiliki alas ${a} cm dan tinggi ${t} cm. Luas segitiga tersebut adalah ... cm².`,c,[a*t,a+t,c+t],EX('Dua segitiga yang sama dapat disusun menjadi satu persegi panjang berukuran alas × tinggi. Jadi luas satu segitiga = ½ × alas × tinggi. Tinggi harus tegak lurus alas (garis putus-putus pada gambar).',[`Diketahui: alas ${a} cm, tinggi ${t} cm.`,`Rumus: L = ½ × a × t.`,`Hitung: ½ × ${a} × ${t} = ${a*t} : 2 = ${c}.`,`Pilihan ${a*t} adalah luas persegi panjang (lupa dikali ½).`],`${c} cm².`))},
()=>{const p=R(10,30),l=R(5,20),t=R(4,12),c=p*l*t;VZ=box(p,l,t);return mk(`Akuarium berbentuk balok berukuran panjang ${p} cm, lebar ${l} cm, dan tinggi ${t} cm. Volume akuarium adalah ... cm³.`,c,[2*(p*l+l*t+p*t),p+l+t,p*l],EX('Volume balok = luas alas × tinggi = panjang × lebar × tinggi. Volume menyatakan banyaknya kubus satuan yang mengisi ruang, satuannya kubik (cm³).',[`Diketahui: p = ${p} cm, l = ${l} cm, t = ${t} cm.`,`Luas alas = ${p} × ${l} = ${p*l} cm².`,`Volume = luas alas × tinggi = ${p*l} × ${t} = ${c} cm³.`,`Pilihan ${p*l} hanya luas alas (belum dikali tinggi).`],`${c} cm³.`))},
()=>{const st=R(6,10)*60+P([0,15,30,45]),du=P([75,90,105,135,150]),ar=st+du;VZ=clock(st);return mk(`Kereta berangkat pukul ${T(st)}. Perjalanan memerlukan ${du} menit. Kereta tiba pukul ...`,T(ar),[T(ar+15),T(ar-30),T(ar+60)],EX('Waktu tiba = waktu berangkat + lama perjalanan. 1 jam = 60 menit, sehingga jika menit mencapai 60 atau lebih, ubah menjadi jam.',[`Waktu berangkat ${T(st)} (sesuai jam pada gambar).`,`Ubah ${du} menit menjadi jam: ${du} menit = ${Math.floor(du/60)} jam ${du%60} menit.`,`Tambah jam dulu: ${T(st)} + ${Math.floor(du/60)} jam = ${T(st+Math.floor(du/60)*60)}.`,`Tambah menit: ${T(st+Math.floor(du/60)*60)} + ${du%60} menit = ${T(ar)}.`],`pukul ${T(ar)}.`))},
()=>{const k=R(2,9),u=P([['km','m'],['kg','gram'],['liter','mL']]);return mk(`${k} ${u[0]} = ... ${u[1]}`,k*1000,[k*100,k*10,k*10000],EX('Awalan “kilo” berarti 1.000. Maka 1 km = 1.000 m, 1 kg = 1.000 gram. Untuk liter, 1 liter = 1.000 mL. Mengubah ke satuan yang lebih kecil berarti mengalikan.',[`Hubungan satuan: 1 ${u[0]} = 1.000 ${u[1]}.`,`${u[1]} lebih kecil dari ${u[0]}, jadi dikalikan 1.000.`,`Hitung: ${k} × 1.000 = ${F(k*1000)}.`],`${k} ${u[0]} = ${F(k*1000)} ${u[1]}.`))},
()=>{const a=R(30,80),b=R(30,80),c=180-a-b;return mk(`Dua sudut sebuah segitiga besarnya ${a}° dan ${b}°. Besar sudut ketiga adalah ...°`,c,[a+b,180-a,c+10],EX('Jumlah ketiga sudut dalam sebuah segitiga selalu 180°.',[`Diketahui dua sudut: ${a}° dan ${b}°.`,`Jumlahkan dua sudut itu: ${a} + ${b} = ${a+b}°.`,`Sudut ketiga = 180° − ${a+b}° = ${c}°.`,`Cek: ${a} + ${b} + ${c} = 180°.`],`${c}°.`))},

()=>{const r=7*R(1,5),c=44*r/7;VZ=circ(r);return mk(`Roda sepeda berjari-jari ${r} cm. Keliling roda tersebut adalah ... cm. (π = 22/7)`,c,[c/2,r*r*22/7,c+22],EX('Keliling lingkaran K = 2 × π × r. Nilai π = 22/7 dipakai ketika jari-jari kelipatan 7 supaya penyebut 7 dapat dicoret.',[`Diketahui: r = ${r} cm, π = 22/7.`,`Masukkan ke rumus: K = 2 × 22/7 × ${r}.`,`Coret 7: ${r} : 7 = ${r/7}, sehingga K = 2 × 22 × ${r/7} = 44 × ${r/7}.`,`Hitung: 44 × ${r/7} = ${c} cm.`,`Pilihan ${r*r*22/7} adalah luas lingkaran (π × r × r), bukan keliling.`],`${c} cm.`))},
()=>{const l=R(8,14),p=R(l+4,24),s=R(2,l-3),c=p*l-s*s;VZ=taman(p,l,s);return mk(`Taman berbentuk persegi panjang berukuran ${p} m × ${l} m. Di tengahnya ada kolam berbentuk persegi dengan sisi ${s} m. Luas taman di luar kolam adalah ... m².`,c,[p*l,p*l+s*s,p*l-4*s],EX('Luas daerah di luar suatu bagian = luas seluruhnya − luas bagian tersebut. Luas persegi panjang = p × l dan luas persegi = sisi × sisi.',[`Luas taman keseluruhan = ${p} × ${l} = ${p*l} m².`,`Luas kolam (persegi) = ${s} × ${s} = ${s*s} m².`,`Luas taman di luar kolam = ${p*l} − ${s*s} = ${c} m².`],`${c} m².`))},
()=>{const m=R(60,95),a=R(-10,10),b=R(-10,10),c=R(-10,10),n=sh([m+a,m+b,m+c,m-a-b-c]);return mk(`Nilai ulangan Rina adalah ${n.join(', ')}. Rata-rata nilai Rina adalah ...`,m,[m+1,m-2,m+3],EX('Rata-rata = jumlah semua nilai : banyaknya nilai.',[`Data: ${n.join(', ')} (ada ${n.length} nilai).`,`Jumlah semua nilai: ${n.join(' + ')} = ${4*m}.`,`Bagi dengan banyak data: ${4*m} : ${n.length} = ${m}.`],`${m}.`))},

()=>{const e=['apel','jeruk','mangga','pisang'],c4=sh(Array.from({length:30},(_,i)=>i+10)).slice(0,4),mx=Math.max(...c4),mn=Math.min(...c4);VZ=bars(e,c4);return mk(`Penjualan buah hari ini: ${e.map((x,i)=>`${x} ${c4[i]} kg`).join(', ')}. Selisih penjualan terbanyak dan tersedikit adalah ... kg.`,mx-mn,[mx,mx+mn,mx-mn+5],EX('Selisih dua nilai = nilai yang lebih besar dikurangi nilai yang lebih kecil. Pada diagram batang, nilai terbesar dan terkecil terlihat dari batang tertinggi dan terendah.',[`Data: ${e.map((x,i)=>`${x} ${c4[i]} kg`).join(', ')}.`,`Terbanyak: ${e[c4.indexOf(mx)]} = ${mx} kg. Tersedikit: ${e[c4.indexOf(mn)]} = ${mn} kg.`,`Selisih = ${mx} − ${mn} = ${mx-mn} kg.`],`${mx-mn} kg.`))},
()=>{const r=R(2,6),b=R(2,6),h=R(1,5),t=r+b+h;VZ=kel(r,b,h);return mk(`Dalam kantong ada ${r} kelereng merah, ${b} biru, dan ${h} hijau. Satu kelereng diambil secara acak. Peluang terambil kelereng merah adalah ...`,fr(r,t),[fr(b,t),fr(r,r+b),fr(h,t),fr(r+1,t)],EX('Peluang kejadian A: P(A) = banyak kejadian yang diinginkan : banyak semua kejadian yang mungkin. Nilainya antara 0 dan 1.',[`Banyak semua kelereng (semua kejadian) = ${r} + ${b} + ${h} = ${t}.`,`Kejadian yang diinginkan (merah) = ${r}.`,`P(merah) = ${r}/${t}${fr(r,t)!==`${r}/${t}`?`, disederhanakan dengan FPB ${gcd(r,t)} menjadi ${fr(r,t)}`:' (sudah paling sederhana)'}.`],`${fr(r,t)}.`))},

mk('Ide pokok teks tersebut adalah ...',`Kerja bakti membersihkan ${tp}`,['Cara memilah sampah plastik','Hadiah dari Pak RT',`Alat kebersihan yang dibawa ${n}`],EX(IP,[`Daftar isi tiap kalimat: (1) kerja bakti di ${tp}; (2) alat yang dibawa; (3) memungut dan memilah sampah; (4) tempat menjadi bersih; (5) pujian dan hadiah.`,`Kelima kalimat itu berpusat pada satu kegiatan: kerja bakti membersihkan ${tp}.`,`Pilihan lain hanya satu detail: memilah sampah (kalimat 3), hadiah Pak RT (kalimat 5), atau alat yang dibawa ${n} (kalimat 2). Semuanya ide penjelas.`],`Kerja bakti membersihkan ${tp}.`)),
mk(`Sikap yang dapat diteladani dari ${n} dan teman-temannya adalah ...`,'peduli lingkungan dan kompak',['suka bermain di lapangan','tidak mau bekerja sama','hanya ingin mendapat hadiah'],EX(SIKAP,['Catat perbuatan tokoh: mengadakan kerja bakti, membawa alat kebersihan, memungut dan memilah sampah.','Perbuatan membersihkan lingkungan menunjukkan sikap peduli lingkungan; dikerjakan bersama-sama dan dipuji Pak RT karena kekompakannya, sehingga mereka juga kompak.','Pilihan lain bertentangan dengan teks: mereka bekerja (bukan sekadar bermain), mereka bekerja sama, dan hadiah baru diberikan setelah kegiatan selesai (bukan tujuan utama).'],'peduli lingkungan dan kompak.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Sampah plastik dipilah ke dalam dua karung','Pak RT memuji kekompakan anak-anak'],['Kerja bakti dilakukan pada hari Sabtu',`${m} membawa ${a1}`],EX(KOMP,[ck('Sampah plastik dipilah ke dalam dua karung',1,'sesuai kalimat ketiga.'),ck('Pak RT memuji kekompakan anak-anak',1,'sesuai kalimat terakhir.'),ck('Kerja bakti dilakukan pada hari Sabtu',0,'teks menyebut hari Minggu pagi.'),ck(`${m} membawa ${a1}`,0,`${m} membawa ${a2}, sedangkan ${a1} dibawa ${n}.`)],'dua pernyataan yang bernilai benar.'))]}},
()=>({t:'Kelelawar adalah satu-satunya mamalia yang dapat terbang. Pada siang hari, kelelawar tidur dengan posisi menggantung di gua atau pohon besar. Saat malam tiba, kelelawar mencari makan. Ada kelelawar pemakan buah dan ada pula pemakan serangga. Kelelawar pemakan buah membantu penyerbukan bunga dan menyebarkan biji, sehingga hutan dapat tumbuh kembali.',qs:[
mk('Kelelawar mencari makan pada ...','malam hari',['siang hari','pagi hari','sore hari'],EX(TS,['Kata kunci pertanyaan: “mencari makan”.','Kalimat ketiga berbunyi: “Saat malam tiba, kelelawar mencari makan.”','Siang hari kelelawar justru tidur menggantung (kalimat kedua), sehingga “siang hari” salah. Pagi dan sore tidak disebut di teks.'],'malam hari.')),
mk('Kelelawar termasuk golongan hewan ...','mamalia',['burung','serangga','reptil'],EX(TS,['Kata kunci pertanyaan: “golongan hewan”.','Kalimat pertama berbunyi: “Kelelawar adalah satu-satunya mamalia yang dapat terbang.”','Walaupun dapat terbang, kelelawar bukan burung. Serangga dan reptil tidak disinggung sebagai golongan kelelawar (serangga hanya disebut sebagai makanan).'],'mamalia.')),
mk('Manfaat kelelawar pemakan buah bagi hutan adalah ...','membantu penyerbukan dan menyebarkan biji',['mengurangi jumlah serangga','membuat gua menjadi hangat','menghasilkan buah-buahan'],EX(TS,['Kata kunci pertanyaan: “manfaat”, “pemakan buah”, dan “hutan”.','Kalimat terakhir berbunyi: “Kelelawar pemakan buah membantu penyerbukan bunga dan menyebarkan biji, sehingga hutan dapat tumbuh kembali.”','“Mengurangi serangga” adalah kebiasaan kelelawar pemakan serangga, bukan pemakan buah. “Menghangatkan gua” dan “menghasilkan buah” tidak ada di teks.'],'membantu penyerbukan dan menyebarkan biji.')),
mk('Simpulan yang tepat dari teks tersebut adalah ...','Kelelawar penting bagi kelestarian hutan',['Kelelawar adalah burung yang aktif pada malam hari','Semua kelelawar memakan serangga','Kelelawar berbahaya bagi hutan'],EX(SIM,['Kumpulkan fakta: kelelawar adalah mamalia, aktif malam hari, ada pemakan buah dan pemakan serangga, dan pemakan buah membantu hutan tumbuh kembali.','Fakta yang paling menentukan adalah kalimat terakhir: kelelawar membantu hutan tumbuh kembali. Maka simpulannya: kelelawar penting bagi kelestarian hutan.','Pilihan lain bertentangan dengan fakta: kelelawar bukan burung, ada juga yang memakan buah, dan kelelawar bermanfaat (bukan berbahaya).'],'Kelelawar penting bagi kelestarian hutan.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Kelelawar tidur menggantung pada siang hari','Ada kelelawar yang memakan serangga'],['Semua kelelawar hanya makan buah','Kelelawar tidak dapat terbang'],EX(KOMP,[ck('Kelelawar tidur menggantung pada siang hari',1,'sesuai kalimat kedua.'),ck('Ada kelelawar yang memakan serangga',1,'sesuai kalimat keempat.'),ck('Semua kelelawar hanya makan buah',0,'teks menyebut ada pemakan buah dan ada pemakan serangga.'),ck('Kelelawar tidak dapat terbang',0,'kalimat pertama menyebut kelelawar mamalia yang dapat terbang.')],'dua pernyataan yang bernilai benar.'))]}),
()=>{const s=P(['SDN Harapan','SD Cahaya Bangsa','SD Tunas Muda']),hr=P(['Senin','Rabu','Jumat']),tg=R(10,25),jm=P([8,9,10]),tp=P(['aula sekolah','ruang perpustakaan']),gr=P(['Bu Ratna','Pak Hendra']),bt=tg-R(3,5);
return{t:`<b>PENGUMUMAN</b><br>Perpustakaan ${s} mengadakan lomba bercerita pada hari ${hr}, ${tg} Mei, pukul ${jm}.00 WIB di ${tp}. Lomba terbuka untuk siswa kelas IV sampai VI. Peserta mendaftar kepada ${gr} paling lambat tanggal ${bt} Mei. Pemenang akan mendapat piala dan buku cerita.`,qs:[
mk('Lomba akan dilaksanakan pada tanggal ...',`${tg} Mei`,[`${bt} Mei`,`${tg+1} Mei`,`${tg-1} Mei`],EX('Pengumuman memuat unsur apa, kapan, di mana, dan siapa. Satu teks bisa memuat dua tanggal berbeda (tanggal acara dan batas pendaftaran), jadi pahami fungsi tiap tanggal.',['Kata kunci pertanyaan: “dilaksanakan” → tanggal acara.',`Kalimat pertama: “lomba bercerita pada hari ${hr}, ${tg} Mei, pukul ${jm}.00 WIB”. Tanggal acara = ${tg} Mei.`,`Tanggal ${bt} Mei muncul di kalimat ketiga sebagai batas akhir mendaftar (“paling lambat”), bukan hari lomba.`,`Tanggal ${tg-1} dan ${tg+1} Mei tidak disebut di teks.`],`${tg} Mei.`)),
mk('Peserta harus mendaftar kepada ...',gr,[gr=='Bu Ratna'?'Pak Hendra':'Bu Ratna','ketua kelas','petugas kebersihan'],EX(TS,['Kata kunci pertanyaan: “mendaftar kepada”.',`Kalimat ketiga: “Peserta mendaftar kepada ${gr} paling lambat tanggal ${bt} Mei.”`,'Kata “kepada” menunjukkan orang yang dituju untuk mendaftar. Nama lain, ketua kelas, dan petugas kebersihan tidak disebut di teks.'],`${gr}.`)),
mk('Siswa yang boleh mengikuti lomba adalah ...','kelas IV sampai VI',['kelas I sampai III','semua guru','kelas VI saja'],EX(TS,['Kata kunci pertanyaan: “siswa yang boleh mengikuti” → syarat peserta.','Kalimat kedua: “Lomba terbuka untuk siswa kelas IV sampai VI.”','Rentang kelas IV sampai VI mencakup tiga kelas, jadi “kelas VI saja” terlalu sempit. “Kelas I sampai III” di luar rentang, dan guru bukan siswa.'],'kelas IV sampai VI.')),
mk('Tujuan teks tersebut dibuat adalah ...','memberi tahu adanya lomba bercerita',['menceritakan pengalaman lomba','mengajak membeli buku cerita','menjelaskan cara bercerita'],EX('Pengumuman adalah teks yang bertujuan memberi tahu sesuatu kepada banyak orang. Cirinya: ada judul “PENGUMUMAN”, memuat waktu, tempat, dan hal yang perlu dilakukan pembaca.',['Perhatikan ciri teks: judul “PENGUMUMAN”, ada hari, tanggal, pukul, tempat, syarat peserta, dan batas pendaftaran.','Semua unsur itu dipakai untuk menyampaikan informasi tentang lomba yang akan datang.','Pilihan lain keliru: teks tidak menceritakan pengalaman (lomba belum berlangsung), tidak mengajak membeli buku, dan tidak berisi langkah-langkah bercerita.'],'memberi tahu adanya lomba bercerita.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Pemenang mendapat piala dan buku cerita',`Lomba dimulai pukul ${jm}.00 WIB`],['Lomba diadakan di lapangan upacara','Pendaftaran dibuka sampai hari lomba'],EX(KOMP,[ck('Pemenang mendapat piala dan buku cerita',1,'sesuai kalimat terakhir.'),ck(`Lomba dimulai pukul ${jm}.00 WIB`,1,'sesuai kalimat pertama.'),ck('Lomba diadakan di lapangan upacara',0,`teks menyebut tempatnya di ${tp}.`),ck('Pendaftaran dibuka sampai hari lomba',0,`pendaftaran paling lambat ${bt} Mei, sedangkan lomba ${tg} Mei.`)],'dua pernyataan yang bernilai benar.'))]}},
()=>{const n=P(NA),km=P([3,4]);return{t:`${n} tinggal di desa tepi hutan. Setiap pagi ia berjalan ${km} kilometer menuju sekolah. Saat musim hujan, jalan menjadi becek dan licin, tetapi ${n} tidak pernah mengeluh. Ia berangkat lebih awal agar tidak terlambat. Sepulang sekolah, ${n} membantu ibu menjual sayur di pasar. Berkat ketekunannya, ${n} meraih juara pertama olimpiade sains tingkat kabupaten.`,qs:[
mk(`Berapa jarak yang ditempuh ${n} setiap pagi ke sekolah?`,`${km} kilometer`,[`${km+1} kilometer`,`${km-1} kilometer`,`${km+2} kilometer`],EX(TS,['Kata kunci pertanyaan: “jarak”, “setiap pagi”, dan “ke sekolah”.',`Kalimat kedua: “Setiap pagi ia berjalan ${km} kilometer menuju sekolah.”`,`Angka yang tertulis ${km}, sehingga pilihan ${km-1}, ${km+1}, dan ${km+2} kilometer tidak sesuai teks.`],`${km} kilometer.`)),
mk(`Mengapa ${n} berangkat lebih awal saat musim hujan?`,'agar tidak terlambat',['karena ingin bermain di jalan','karena sekolah libur lebih cepat','karena disuruh ibu menjual sayur'],EX('Hubungan sebab-akibat dan tujuan sering ditandai kata hubung seperti “agar”, “supaya”, “karena”. Kata “agar” menunjukkan tujuan dari sebuah perbuatan.',['Kata kunci pertanyaan: “berangkat lebih awal”.','Kalimat keempat: “Ia berangkat lebih awal agar tidak terlambat.”',`Kata hubung “agar” memperlihatkan tujuan ${n} berangkat awal, yaitu tidak terlambat (jalan becek dan licin membuat perjalanan lebih lama).`,'Bermain di jalan, libur lebih cepat, dan disuruh menjual sayur tidak disebut sebagai alasan.'],'agar tidak terlambat.')),
mk(`Sifat ${n} yang paling tepat adalah ...`,'gigih dan tidak mudah mengeluh',['pemalu dan penakut','sombong dan pemarah','malas tetapi pandai'],EX(SIKAP,['Catat perbuatan tokoh: berjalan jauh setiap pagi, tidak mengeluh walau jalan becek dan licin, berangkat lebih awal, membantu ibu, dan akhirnya menjadi juara.',`Berusaha terus meskipun sulit = gigih. Kalimat “${n} tidak pernah mengeluh” menguatkan sifat tidak mudah mengeluh.`,'Sifat pemalu, penakut, sombong, pemarah, dan malas tidak ditunjukkan oleh perbuatan apa pun di teks.'],'gigih dan tidak mudah mengeluh.')),
mk(`Pernyataan “Berkat ketekunannya, ${n} meraih juara pertama” menunjukkan hubungan ...`,'sebab-akibat',['perbandingan','urutan waktu','pertentangan'],EX('Hubungan sebab-akibat: sebab adalah hal yang menyebabkan, akibat adalah hasilnya. Kata penanda: “berkat”, “karena”, “sehingga”, “akibatnya”.',['Pecah kalimat menjadi dua bagian: “ketekunannya” dan “meraih juara pertama”.','Kata “berkat” menandai bahwa ketekunan adalah penyebab (sebab) dan juara pertama adalah hasilnya (akibat).','Bukan perbandingan (tidak ada yang dibandingkan), bukan urutan waktu (tidak ada penanda “kemudian/setelah itu”), dan bukan pertentangan (tidak ada “tetapi/namun”).'],'sebab-akibat.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',[`${n} membantu ibu menjual sayur sepulang sekolah`,'Jalan menuju sekolah licin saat musim hujan'],[`${n} diantar ayah ke sekolah`,`${n} juara olimpiade tingkat nasional`],EX(KOMP,[ck(`${n} membantu ibu menjual sayur sepulang sekolah`,1,'sesuai kalimat kelima.'),ck('Jalan menuju sekolah licin saat musim hujan',1,'sesuai kalimat ketiga.'),ck(`${n} diantar ayah ke sekolah`,0,`teks menyebut ${n} berjalan kaki, tidak ada ayah yang mengantar.`),ck(`${n} juara olimpiade tingkat nasional`,0,'teks menyebut tingkat kabupaten, bukan nasional.')],'dua pernyataan yang bernilai benar.'))]}},
()=>({t:'Air putih sangat penting bagi tubuh. Sekitar enam puluh persen tubuh manusia terdiri atas air. Air membantu mengatur suhu tubuh, melancarkan pencernaan, dan mengangkut zat makanan ke seluruh tubuh. Orang yang kekurangan air dapat merasa pusing dan lemas. Karena itu, biasakan minum air putih sedikitnya delapan gelas setiap hari.',qs:[
mk('Berapa gelas air putih yang dianjurkan diminum setiap hari?','delapan gelas',['enam gelas','sepuluh gelas','dua gelas'],EX(TS,['Kata kunci pertanyaan: “gelas”, “dianjurkan”, “setiap hari”.','Kalimat terakhir: “biasakan minum air putih sedikitnya delapan gelas setiap hari.”','Angka “enam puluh persen” di kalimat kedua adalah kadar air dalam tubuh, bukan jumlah gelas. Enam, sepuluh, dan dua gelas tidak disebut.'],'delapan gelas.')),
mk('Akibat kekurangan air adalah ...','pusing dan lemas',['mudah marah','sulit tidur','gigi berlubang'],EX(TS,['Kata kunci pertanyaan: “akibat” dan “kekurangan air”.','Kalimat keempat: “Orang yang kekurangan air dapat merasa pusing dan lemas.”','Mudah marah, sulit tidur, dan gigi berlubang tidak disebutkan sebagai akibat kekurangan air.'],'pusing dan lemas.')),
mk('Kalimat ajakan dalam teks adalah ...','Biasakan minum air putih sedikitnya delapan gelas setiap hari.',['Air putih sangat penting bagi tubuh.','Orang yang kekurangan air dapat merasa pusing dan lemas.','Air membantu mengatur suhu tubuh.'],EX('Kalimat ajakan berisi ajakan atau imbauan agar pembaca melakukan sesuatu. Cirinya ditandai kata seperti “ayo”, “mari”, “biasakan”, atau “jangan”. Kalimat berita hanya menyampaikan fakta.',['Periksa tiap kalimat: apakah mengajak pembaca berbuat sesuatu, atau hanya menyampaikan fakta?','“Air putih sangat penting bagi tubuh”, “Orang yang kekurangan air dapat merasa pusing dan lemas”, dan “Air membantu mengatur suhu tubuh” semuanya hanya memberi informasi (kalimat berita).','“Biasakan minum air putih sedikitnya delapan gelas setiap hari” memakai kata “biasakan” dan mengajak pembaca bertindak, sehingga ini kalimat ajakan.'],'Biasakan minum air putih sedikitnya delapan gelas setiap hari.')),
mk('Teks tersebut bertujuan untuk ...','memberi informasi dan mengajak hidup sehat',['menghibur pembaca','menceritakan pengalaman','menjual air minum'],EX('Tujuan teks dapat dikenali dari isinya. Teks informasi bertujuan memberi pengetahuan; jika diakhiri ajakan, teks juga bertujuan mengajak pembaca bertindak.',['Kalimat 1 sampai 4 berisi pengetahuan: pentingnya air, kadar air tubuh, manfaat air, dan akibat kekurangan air. Ini tujuan memberi informasi.','Kalimat terakhir mengajak pembaca minum delapan gelas sehari. Ini tujuan mengajak hidup sehat.','Tidak ada unsur lucu (menghibur), tidak ada cerita tokoh (pengalaman), dan tidak ada promosi produk (menjual air minum).'],'memberi informasi dan mengajak hidup sehat.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Air membantu melancarkan pencernaan','Sebagian besar tubuh manusia terdiri atas air'],['Air tidak berpengaruh pada suhu tubuh','Kekurangan air membuat tubuh bugar'],EX(KOMP,[ck('Air membantu melancarkan pencernaan',1,'sesuai kalimat ketiga.'),ck('Sebagian besar tubuh manusia terdiri atas air',1,'sekitar enam puluh persen (lebih dari separuh) tubuh adalah air, sesuai kalimat kedua.'),ck('Air tidak berpengaruh pada suhu tubuh',0,'kalimat ketiga menyebut air membantu mengatur suhu tubuh.'),ck('Kekurangan air membuat tubuh bugar',0,'kekurangan air membuat pusing dan lemas.')],'dua pernyataan yang bernilai benar.'))]}),
()=>{const e=sh(['Pramuka','Futsal','Paduan suara','Melukis']),c=sh(Array.from({length:30},(_,i)=>i+10)).slice(0,4),mx=Math.max(...c),mn=Math.min(...c),s=c.reduce((a,b)=>a+b),em=e[c.indexOf(mx)],en=e[c.indexOf(mn)],dt=e.map((x,i)=>`${x} = ${c[i]}`).join(', ');
return{v:bars(e,c),t:`Hasil pendataan kegiatan ekstrakurikuler siswa kelas VI: ${e.map((x,i)=>`${x} ${c[i]} siswa`).join(', ')}. Setiap siswa hanya memilih satu kegiatan.`,qs:[
mk('Kegiatan yang paling banyak diminati adalah ...',em,e.filter(x=>x!==em),EX('Membaca data: nilai terbesar menunjukkan kategori yang paling banyak (paling diminati), nilai terkecil menunjukkan yang paling sedikit.',[`Tulis data: ${dt}.`,`Bandingkan semua angka. Nilai terbesar adalah ${mx}.`,`Angka ${mx} adalah milik ${em}, sedangkan nilai terkecil ${mn} milik ${en}.`],`${em}.`)),
mk('Jumlah seluruh siswa kelas VI adalah ... siswa.',s,[s+10,s-5,mx+mn],EX('Karena setiap siswa hanya memilih satu kegiatan, tidak ada siswa yang terhitung dua kali. Jadi jumlah seluruh siswa sama dengan jumlah semua peminat kegiatan.',[`Data: ${dt}.`,`Jumlahkan semuanya: ${c.join(' + ')}.`,`Hasil: ${c.join(' + ')} = ${s}.`,`Pilihan ${mx+mn} hanya menjumlahkan peminat terbanyak dan tersedikit, tidak semuanya.`],`${s} siswa.`)),
mk('Selisih peminat terbanyak dan tersedikit adalah ... siswa.',mx-mn,[mx,mx+mn,mx-mn+5],EX('Selisih dua nilai diperoleh dengan pengurangan: nilai terbesar dikurangi nilai terkecil.',[`Cari nilai terbesar: ${mx} (${em}).`,`Cari nilai terkecil: ${mn} (${en}).`,`Hitung selisih: ${mx} − ${mn} = ${mx-mn}.`],`${mx-mn} siswa.`)),
mk(`Perbandingan banyak siswa ${e[0]} dan ${e[1]} adalah ...`,`${c[0]} : ${c[1]}`,[`${c[1]} : ${c[0]}`,`${c[0]} : ${c[2]}`,`${c[1]} : ${c[3]}`],EX('Perbandingan A : B ditulis sesuai urutan yang disebut dalam soal: angka pertama milik A, angka kedua milik B. Jika urutan dibalik, artinya berubah.',[`Soal menyebut ${e[0]} lebih dulu, lalu ${e[1]}.`,`Banyak siswa ${e[0]} = ${c[0]} dan ${e[1]} = ${c[1]}.`,`Tulis sesuai urutan: ${e[0]} : ${e[1]} = ${c[0]} : ${c[1]}.`,`Pilihan ${c[1]} : ${c[0]} terbalik; dua pilihan lain memakai kegiatan yang tidak ditanyakan.`],`${c[0]} : ${c[1]}.`)),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',[`${em} paling banyak diminati`,`${en} paling sedikit diminati`],[`${en} paling banyak diminati`,'Jumlah peminat semua kegiatan sama'],EX(KOMP,[`Data: ${dt}.`,ck(`${em} paling banyak diminati`,1,`${c[e.indexOf(em)]} adalah nilai terbesar.`),ck(`${en} paling sedikit diminati`,1,`${c[e.indexOf(en)]} adalah nilai terkecil.`),ck(`${en} paling banyak diminati`,0,`${en} justru yang paling sedikit.`),ck('Jumlah peminat semua kegiatan sama',0,'keempat angka berbeda.')],'dua pernyataan yang bernilai benar.'))]}},
()=>({t:'Seekor semut jatuh ke dalam sungai yang deras. Ia berteriak meminta tolong. Seekor merpati yang bertengger di pohon melihatnya, lalu menjatuhkan selembar daun ke dekat semut. Semut naik ke atas daun dan selamat sampai tepi sungai. Beberapa hari kemudian, seorang pemburu hendak menangkap merpati itu. Semut segera menggigit kaki pemburu. Pemburu terkejut dan merpati pun terbang menjauh.',qs:[
mk('Bagaimana merpati menolong semut?','menjatuhkan selembar daun',['mengangkat semut dengan paruhnya','memanggil teman-temannya','membuat jembatan dari ranting'],EX(TS,['Kata kunci pertanyaan: “merpati” dan “menolong semut”.','Kalimat ketiga: “…merpati… melihatnya, lalu menjatuhkan selembar daun ke dekat semut.” Kalimat keempat: semut naik ke atas daun dan selamat.','Teks tidak menyebut merpati mengangkat semut, memanggil teman, atau membuat jembatan.'],'menjatuhkan selembar daun.')),
mk('Mengapa pemburu terkejut?','kakinya digigit semut',['merpati menyerangnya','jaringnya jatuh ke sungai','semut berteriak keras'],EX('Hubungan sebab-akibat dalam cerita ditemukan dengan menelusuri urutan kejadian: kejadian yang terjadi lebih dulu menjadi sebab, kejadian sesudahnya menjadi akibat.',['Kata kunci pertanyaan: “pemburu terkejut” (akibat). Cari kejadian sebelumnya (sebab).','Dua kalimat terakhir berurutan: “Semut segera menggigit kaki pemburu. Pemburu terkejut dan merpati pun terbang menjauh.”','Gigitan semut terjadi lebih dulu, lalu pemburu terkejut. Jadi penyebab terkejutnya pemburu adalah kakinya digigit semut.','Merpati tidak menyerang (ia terbang menjauh), jaring tidak disebut, dan semut berteriak hanya saat di sungai.'],'kakinya digigit semut.')),
mk('Amanat cerita tersebut adalah ...','Kebaikan akan dibalas dengan kebaikan',['Hewan kecil tidak dapat menolong','Berburu adalah pekerjaan mulia','Sungai berbahaya bagi hewan kecil'],EX('Amanat adalah pesan moral yang dapat dipetik dari cerita. Cara menemukannya: lihat alur (awal, masalah, penyelesaian) lalu tanyakan “apa pelajaran dari perbuatan tokohnya?”.',['Awal: merpati menolong semut yang hanyut.','Kelanjutan: ketika merpati terancam, semut menolong balik dengan menggigit pemburu.','Pelajarannya: orang yang berbuat baik akan menerima kebaikan juga. Itulah amanatnya.','Pilihan lain bertentangan dengan alur: semut kecil justru menolong, berburu tidak dipuji, dan sungai bukan inti pesan cerita.'],'Kebaikan akan dibalas dengan kebaikan.')),
mk('Makna kata “bertengger” pada teks adalah ...','hinggap',['berenang','berlari','bersembunyi'],EX('Makna kata dapat ditebak dari konteks kalimat. Caranya: ganti kata itu dengan pilihan jawaban, lalu lihat apakah kalimatnya tetap masuk akal.',['Kalimat asal: “Seekor merpati yang bertengger di pohon melihatnya…”.','Merpati adalah burung, dan tempatnya di pohon. Aktivitas burung di dahan pohon adalah hinggap.','Uji substitusi: “merpati yang hinggap di pohon” masuk akal. “Berenang di pohon”, “berlari di pohon”, atau “bersembunyi di pohon” tidak sesuai dengan keadaan merpati yang dapat melihat semut di sungai.'],'hinggap.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Semut jatuh ke sungai yang deras','Merpati terbang menjauh setelah pemburu terkejut'],['Semut menolong pemburu','Merpati tinggal di dalam gua'],EX(KOMP,[ck('Semut jatuh ke sungai yang deras',1,'sesuai kalimat pertama.'),ck('Merpati terbang menjauh setelah pemburu terkejut',1,'sesuai kalimat terakhir.'),ck('Semut menolong pemburu',0,'semut justru menggigit pemburu untuk menolong merpati.'),ck('Merpati tinggal di dalam gua',0,'merpati bertengger di pohon, gua tidak disebut.')],'dua pernyataan yang bernilai benar.'))]}),
()=>({t:'<b>Cara menanam kacang hijau di kapas</b><br>1. Siapkan wadah, kapas, dan biji kacang hijau.<br>2. Basahi kapas dengan air, lalu letakkan di dalam wadah.<br>3. Taburkan biji kacang hijau di atas kapas.<br>4. Letakkan wadah di tempat yang terkena cahaya.<br>5. Siram kapas setiap hari agar tetap lembap.',qs:[
mk('Langkah yang dilakukan setelah biji ditaburkan adalah ...','meletakkan wadah di tempat terkena cahaya',['membasahi kapas','menyiapkan wadah','menyiram dengan air panas'],EX('Teks prosedur disusun berurutan; urutan nomor tidak boleh dibolak-balik karena tiap langkah bergantung pada langkah sebelumnya.',['Cari langkah “menaburkan biji”: langkah nomor 3.','Pertanyaan menanyakan langkah sesudahnya, yaitu nomor 4: “Letakkan wadah di tempat yang terkena cahaya.”','Membasahi kapas adalah langkah 2 dan menyiapkan wadah langkah 1 (keduanya sebelum menabur). Air panas tidak disebut.'],'meletakkan wadah di tempat terkena cahaya.')),
mk('Mengapa kapas disiram setiap hari?','agar tetap lembap',['agar berwarna putih','agar biji menjadi besar','agar kapas tidak hilang'],EX(TS,['Kata kunci pertanyaan: “disiram setiap hari”.','Langkah 5: “Siram kapas setiap hari agar tetap lembap.”','Kata “agar” memperlihatkan alasan: supaya kapas tetap lembap. Warna putih, ukuran biji, dan kapas hilang tidak disebut sebagai alasan.'],'agar tetap lembap.')),
mk('Teks tersebut termasuk teks ...','prosedur',['narasi','deskripsi','puisi'],EX('Teks prosedur menjelaskan cara melakukan atau membuat sesuatu. Cirinya: judul “Cara…”, ada alat dan bahan, langkah bernomor berurutan, dan memakai kalimat perintah.',['Judul teks: “Cara menanam kacang hijau di kapas” (judul diawali “Cara”).','Langkah 1 memuat alat dan bahan, langkah 2 sampai 5 bernomor berurutan dan berupa kalimat perintah (“Siapkan”, “Basahi”, “Taburkan”, “Letakkan”, “Siram”).','Narasi berisi cerita tokoh, deskripsi menggambarkan ciri benda, dan puisi tersusun dalam bait. Tidak ada satu pun ciri itu di teks ini.'],'prosedur.')),
mk('Alat dan bahan yang diperlukan adalah ...','wadah, kapas, dan biji kacang hijau',['pot, tanah, dan pupuk','gelas, pasir, dan batu','kapas, gunting, dan lem'],EX(TS,['Alat dan bahan pada teks prosedur biasanya ada di langkah pertama.','Langkah 1: “Siapkan wadah, kapas, dan biji kacang hijau.”','Tanah, pupuk, pot, pasir, batu, gunting, dan lem tidak disebut pada langkah mana pun (air disebut di langkah 2 tetapi tidak ada di pilihan).'],'wadah, kapas, dan biji kacang hijau.')),
mkK('Pilih dua pernyataan yang sesuai dengan teks!',['Wadah diletakkan di tempat yang terkena cahaya','Kapas harus dibasahi dengan air'],['Biji ditanam di dalam tanah','Kapas disiram seminggu sekali'],EX(KOMP,[ck('Wadah diletakkan di tempat yang terkena cahaya',1,'sesuai langkah 4.'),ck('Kapas harus dibasahi dengan air',1,'sesuai langkah 2.'),ck('Biji ditanam di dalam tanah',0,'biji ditaburkan di atas kapas (langkah 3).'),ck('Kapas disiram seminggu sekali',0,'langkah 5 menyebut disiram setiap hari.')],'dua pernyataan yang bernilai benar.'))]})
];
// ===== Membuat satu paket =====
function build(v,p,mode){seed(p);
const dm=i=>i<14?'Bilangan':i<24?'Geometri dan Pengukuran':'Data dan Peluang',mi=v=='k'?[...sh(Array.from({length:14},(_,i)=>i)).slice(0,4),...sh(Array.from({length:10},(_,i)=>i+14)).slice(0,3),...sh(Array.from({length:6},(_,i)=>i+24)).slice(0,3)]:sh(Array.from({length:30},(_,i)=>i));
const mat=sh(mi).map(i=>{VZ='';const q=G[i]();return{...q,v:VZ,dm:dm(i),s:'Matematika dan Numerasi'}});
const bhs=sh([0,1,2,3,4,5,6,7]).slice(0,v=='k'?2:6).flatMap(i=>{const x=TX[i]();x.v=x.v||`<div style="font-size:2.4rem;text-align:center">${EM[i]}</div>`;return x.qs.map(q=>({...q,v:x.v,t:x.t,dm:'Literasi Membaca',s:'Bahasa Indonesia dan Literasi'}))});
if(v=='k')return[{n:'Tryout Kilat',min:30,qs:[...mat,...bhs]}];
const S=[{n:'Matematika dan Numerasi',min:75,qs:mat},{n:'Bahasa Indonesia dan Literasi',min:75,qs:bhs}];
return mode=='m'?[S[0]]:mode=='b'?[S[1]]:S}
// ===== Tampilan =====
let S,H={v:'s',p:1,nm:'',m:'a'},tmr;const app=document.getElementById('app');
const hist=()=>{try{return JSON.parse(localStorage.getItem('tkaanis2')||'{}')}catch(e){return{}}};
function home(){clearInterval(tmr);const h=hist()[H.v];app.innerHTML=`<div class="hero"><h1>📝 Tryout TKA Anis</h1><p>Latihan Tes Kemampuan Akademik (TKA) SD/MI</p></div><div class="card">
<div class="row"><button class="vc ${H.v=='k'?'sel':''}" onclick="H.v='k';home()"><div class="ic">⚡</div><b>Versi Kilat</b><br><span class="mu">20 soal · 30 menit</span></button><button class="vc ${H.v=='s'?'sel':''}" onclick="H.v='s';home()"><div class="ic">🎯</div><b>Versi Standar</b><br><span class="mu">60 soal · 2 × 75 menit</span></button></div>
<p class="mu">${H.v=='k'?'10 soal Matematika dan Numerasi + 10 soal Bahasa Indonesia dan Literasi dalam satu sesi.':'30 soal Matematika dan Numerasi (75 menit) lalu 30 soal Bahasa Indonesia dan Literasi (75 menit).'} Setiap sesi berisi soal yang berbeda.</p>
${H.v=='s'?`<select onchange="H.m=this.value"><option value="a" ${H.m=='a'?'selected':''}>Kerjakan kedua mata uji</option><option value="m" ${H.m=='m'?'selected':''}>Matematika saja</option><option value="b" ${H.m=='b'?'selected':''}>Bahasa Indonesia saja</option></select>`:''}
<input placeholder="👤 Nama kamu" maxlength="30" value="${H.nm}" oninput="H.nm=this.value">
${h?`<p class="mu">🏅 Sesi selesai: <b>${h.n}</b> · Nilai terbaik: <b>${h.best}</b></p>`:''}
<button class="b" style="width:100%;padding:14px" onclick="start()">🚀 Mulai Sesi Baru</button></div>
<div class="card mu"><b>Materi</b><br>Matematika: Bilangan, Geometri dan Pengukuran, Data dan Peluang.<br>Bahasa Indonesia: literasi membaca (narasi, informasi, pengumuman, prosedur, data).<br>Bentuk soal: pilihan ganda dan pilihan ganda kompleks. Soal mengacu pada kisi-kisi TKA SD Kemendikdasmen, bukan soal resmi.</div>`}
const sn=()=>{try{return JSON.parse(localStorage.getItem('tkaseen')||'[]')}catch(e){return[]}};
const sgn=ss=>{let h=5381;for(const c of JSON.stringify(ss.map(x=>x.qs.map(q=>q.q+q.o.join()))))h=(h*33^c.charCodeAt(0))>>>0;return h};
function start(){const seen=sn();let sd,secs,sig,k=0;do{sd=Math.floor(Math.random()*2e9);secs=build(H.v,sd,H.m);sig=sgn(secs);k++}while(seen.includes(sig)&&k<30);seen.push(sig);try{localStorage.setItem('tkaseen',JSON.stringify(seen.slice(-300)))}catch(e){}
S={v:H.v,nm:(H.nm.trim()||'Peserta').replace(/[<>&]/g,''),secs,si:0,i:0};S.ans=S.secs.map(s=>s.qs.map(()=>[]));begin()}
function begin(){S.i=0;S.end=Date.now()+S.secs[S.si].min*60000;clearInterval(tmr);tmr=setInterval(tick,1000);quiz()}
function tick(){const t=document.getElementById('tm');if(!t)return;const r=Math.max(0,Math.round((S.end-Date.now())/1000));t.textContent=`⏱ ${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;t.classList.toggle('low',r<300);if(!r)endSec()}
function quiz(){const sc=S.secs[S.si],q=sc.qs[S.i],sel=S.ans[S.si][S.i],n=sc.qs.length,got=S.ans[S.si].filter(a=>a.length).length;
app.innerHTML=`<div class="top"><span class="tag">${sc.n}</span><span id="tm" class="tm"></span></div><div class="bar"><div style="width:${(S.i+1)/n*100}%"></div></div>${q.t?`<div class="card tx">${q.v||''}📖 ${q.t}</div>`:''}<div class="card"><span class="tag">${q.dm}</span> <span class="mu">Soal ${S.i+1} dari ${n}</span>${q.t?'':q.v||''}<p class="q">${q.q}</p><div class="mu">${q.k==2?'☑ Pilih semua jawaban yang benar':'Pilih satu jawaban'}</div>${q.o.map((o,k)=>`<button class="op ${sel.includes(o)?'sel':''}" onclick="pick(${k})"><i>${q.k==2?(sel.includes(o)?'✓':''):'ABCD'[k]}</i><span>${o}</span></button>`).join('')}</div><div class="mu" style="margin-bottom:6px">Terjawab ${got} dari ${n}</div><div class="nav">${sc.qs.map((_,k)=>`<button class="n ${S.ans[S.si][k].length?'dn':''} ${k==S.i?'cur':''}" onclick="go(${k})">${k+1}</button>`).join('')}</div><div class="row"><button class="g" onclick="go(S.i-1)" ${S.i?'':'disabled'}>← Sebelumnya</button>${S.i<n-1?'<button class="b" onclick="go(S.i+1)">Berikutnya →</button>':'<button class="b" onclick="endSec()">✅ Selesai</button>'}</div>`;tick()}
function pick(k){const q=S.secs[S.si].qs[S.i],o=q.o[k],a=S.ans[S.si];if(q.k==1)a[S.i]=[o];else a[S.i]=a[S.i].includes(o)?a[S.i].filter(x=>x!==o):[...a[S.i],o];quiz()}
const go=k=>{S.i=k;quiz()};
const okQ=(q,a)=>a.length==q.a.length&&q.a.every(x=>a.includes(x));
let RS={};
function revBox(){const{si,f,sis}=RS,sc=S.secs[si];const L=sc.qs.map((q,i)=>{const a=S.ans[si][i],ok=okQ(q,a);if(f=='bad'&&ok||f=='ok'&&!ok)return'';return`<div class="rv ${ok?'g':'x'}"><div class="mu">No. ${i+1} · ${q.dm}</div>${q.t&&(i==0||sc.qs[i-1].t!==q.t)?`<div class="tx2">📖 ${q.t}</div>`:''}${q.t?'':q.v||''}<div><b>${q.q}</b></div><div class="${ok?'ok':'bad'}">${ok?'✔':'✘'} Jawabanmu: ${a.length?a.join('; '):'(kosong)'}</div>${ok?'':`<div class="ok">✔ Jawaban benar: ${q.a.join('; ')}</div>`}<div class="exp">💡 <b>Pembahasan:</b> ${q.e}</div></div>`}).join('');
return`<b>📚 Pembahasan</b>${sis.length>1?`<div class="chips">${sis.map(x=>`<button class="${x==si?'sel':''}" onclick="setRev(${x},RS.f)">${S.secs[x].n.split(' ')[0]}</button>`).join('')}</div>`:''}<div class="chips">${[['all','Semua'],['bad','Salah ✘'],['ok','Benar ✔']].map(([k,t])=>`<button class="${f==k?'sel':''}" onclick="setRev(${si},'${k}')">${t}</button>`).join('')}</div>${L||'<p class="mu">Tidak ada soal pada filter ini.</p>'}`}
function setRev(si,f){RS.si=si;RS.f=f;document.getElementById('rvbox').innerHTML=revBox()}
function endSec(){clearInterval(tmr);const si=S.si,sc=S.secs[si],b=sc.qs.filter((q,i)=>okQ(q,S.ans[si][i])).length;
if(si<S.secs.length-1){RS={si,f:'all',sis:[si]};app.innerHTML=`<div class="hero"><h1>✅ ${sc.n} selesai</h1><p>Skor sesi ini: <b>${b} dari ${sc.qs.length}</b>. Baca pembahasannya, lalu lanjut ke sesi berikutnya.</p></div><button class="b" style="width:100%;padding:14px;margin-bottom:12px" onclick="S.si++;begin()">Lanjut: ${S.secs[si+1].n} →</button><div class="card" id="rvbox">${revBox()}</div>`;window.scrollTo(0,0);return}result()}
function result(){let tot=0,ben=0;const per=S.secs.map((sc,si)=>{const b=sc.qs.filter((q,i)=>okQ(q,S.ans[si][i])).length;tot+=sc.qs.length;ben+=b;return`<div class="srow"><span>${sc.n}</span><b>${b}/${sc.qs.length}</b></div>`}).join('');
const nilai=Math.round(ben/tot*100),msg=nilai>=80?'🌟 Hebat sekali!':nilai>=60?'👍 Bagus, terus berlatih!':'💪 Ayo semangat belajar lagi!';
try{const h=hist(),x=h[S.v]||{n:0,best:0};x.n++;x.best=Math.max(x.best,nilai);h[S.v]=x;S.no=x.n;localStorage.setItem('tkaanis2',JSON.stringify(h))}catch(e){S.no=1}
const dm={};S.secs.forEach((sc,si)=>sc.qs.forEach((q,i)=>{const d=dm[q.dm]=dm[q.dm]||[0,0];d[1]++;if(okQ(q,S.ans[si][i]))d[0]++}));
RS={si:0,f:'all',sis:S.secs.map((_,i)=>i)};
app.innerHTML=`<div class="hero" style="text-align:center"><div style="opacity:.92">Hasil ${S.nm} · ${S.v=='k'?'Kilat':'Standar'} · Sesi ke-${S.no}</div><div class="ring" style="--v:${nilai}"><div><b>${nilai}</b></div></div><h1>${msg}</h1></div>
<div class="card">${per}<hr style="border:0;border-top:1px solid var(--bd);margin:10px 0">${Object.entries(dm).map(([k,v])=>`<div class="srow mu"><span>${k}</span><span>${v[0]}/${v[1]}</span></div><div class="bar" style="margin-bottom:6px"><div style="width:${v[0]/v[1]*100}%"></div></div>`).join('')}</div>
<div class="row" style="margin-bottom:12px"><button class="b" onclick="home()">🏠 Menu</button><button class="g" onclick="start()">🔁 Sesi Baru</button></div><div class="card" id="rvbox">${revBox()}</div>`;window.scrollTo(0,0)}
home();
</script></body></html>
